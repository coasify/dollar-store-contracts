[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
# Deterministic bytecode for reliable explorer verification (drops the nondeterministic
# ipfs metadata hash that breaks Etherscan's exact match on large via_ir contracts).
bytecode_hash = "none"

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/"
]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 128
depth = 32
fail_on_revert = false

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"

# Explorer verification (forge script --verify). Etherscan V2: one key works across chains.
[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }

# These rules flag patterns the protocol uses on purpose. The remaining rules stay on; a single
# exception is marked in the source with the reason.
[lint]
exclude_lints = [
    "reentrancy-events",                # every function that moves tokens is nonReentrant
    "require-revert-in-loop",           # fill-or-revert swaps and admin batch checks
    "calls-loop",                       # one price feed per hub asset; bounded queue payouts
    "block-timestamp",                  # deadlines and oracle staleness
    "boolean-cst",
    "uninitialized-local",
    "environment-read-across-mutation", # tests only
]
