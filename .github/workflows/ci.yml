name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *" # daily: catches listed tokens changing their zero-value transfer behavior

jobs:
  build-test:
    name: build + test + coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv

      - name: Coverage (min gate on src/)
        run: |
          forge coverage --report lcov --ir-minimum
          python3 ci/coverage_gate.py

  slither:
    name: static analysis (slither)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run Slither
        uses: crytic/slither-action@v0.4.0
        with:
          target: contracts/
          slither-config: contracts/slither.config.json
          fail-on: high

  fork-probe:
    name: exit probe vs mainnet tokens
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    env:
      MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Require the RPC secret (the fork tests skip silently without it)
        run: |
          if [ -z "$MAINNET_RPC_URL" ]; then
            echo "MAINNET_RPC_URL secret is not set; the fork tests would skip." >&2
            exit 1
          fi

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Fork tests
        run: forge test --match-path "test/fork/*" -vvv
